[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conciliacion-victoriafoods"
version = "0.1.0"
description = "Pipeline de conciliación de ventas de agregadores (v1: PedidosYa) para Victoria Foods"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "python-calamine>=0.2",
  "ftfy>=6.2",
  "pdfplumber>=0.11",
  "pyyaml>=6.0",
  "requests>=2.31",
  "pyarrow>=15",
]

[project.optional-dependencies]
gcp = [
  "google-cloud-storage>=2.16",
  "google-cloud-bigquery>=3.20",
  "google-auth>=2.29",
]
dev = [
  "pytest>=8",
  "ruff>=0.5",
  "xlwt>=1.3",
  "reportlab>=4.0",
]

[project.scripts]
conciliacion = "conciliacion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
conciliacion = ["config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501", "SIM114", "RUF012"]
